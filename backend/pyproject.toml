[project]
name = "tunora-backend"
version = "0.1.0"
description = "Tunora backend — FastAPI service orchestrating pluggable music generation providers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: real end-to-end test against a locally running ACE-Step API server (uses GPU).",
]
